<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA STORE Mini App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f8fafc; font-family: sans-serif; user-select: none; }
    .bg-purple-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
    .active-tab { color: #7c3aed; font-weight: bold; }
  </style>
</head>
<body class="pb-20 text-gray-800">

  <!-- Header -->
  <div class="flex justify-between items-center px-4 py-3 bg-white shadow-sm sticky top-0 z-40">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-full bg-purple-600 flex items-center justify-center text-white font-bold text-xs">▲</div>
      <div>
        <h1 class="font-bold text-sm tracking-wide text-gray-900 leading-none">NEXORA</h1>
        <span class="text-[9px] text-purple-600 tracking-widest uppercase font-semibold">✦ DIGITAL SERVICES ✦</span>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <i class="fa-regular fa-bell text-gray-600 text-lg"></i>
      <div class="bg-purple-100 text-purple-700 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1">
        <span>৳</span><span id="header-balance">0.00</span>
      </div>
    </div>
  </div>

  <!-- Main Container -->
  <div id="app-content" class="p-4 max-w-md mx-auto">
    <!-- Pages render here dynamically -->
  </div>

  <!-- Bottom Navigation -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-2 z-40 max-w-md mx-auto">
    <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-xs text-gray-500 active-tab">
      <i class="fa-solid fa-house text-lg"></i><span>Home</span>
    </button>
    <button onclick="switchTab('add-fund')" id="nav-add-fund" class="flex flex-col items-center text-xs text-gray-500">
      <i class="fa-solid fa-wallet text-lg"></i><span>Add Fund</span>
    </button>
    <button onclick="switchTab('orders')" id="nav-orders" class="flex flex-col items-center text-xs text-gray-500">
      <i class="fa-solid fa-clipboard-list text-lg"></i><span>Orders</span>
    </button>
    <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center text-xs text-gray-500">
      <i class="fa-solid fa-user text-lg"></i><span>Profile</span>
    </button>
  </div>

  <!-- Hidden Admin Floating Button (Visible ONLY to Admin Telegram ID) -->
  <button id="admin-secret-btn" onclick="openAdminPanel()" class="hidden fixed bottom-16 right-4 bg-red-600 text-white w-12 h-12 rounded-full shadow-2xl z-50 flex items-center justify-center font-bold text-xl animate-bounce">
    ⚙️
  </button>

  <!-- Script Logic -->
  <script>
    const ADMIN_ID = 7753794493; // আপনার অ্যাডমিন টেলিগ্রাম আইডি
    const tg = window.Telegram.WebApp;
    tg.expand();

    // App State Mock Database (Local Storage Persistent)
    let state = JSON.parse(localStorage.getItem('aura_state')) || {
      users: {},
      products: [
        { id: 1, type: 'vpn', name: 'ExpressVPN Premium', price: 120, image: 'https://cdn-icons-png.flaticon.com/512/2885/2885440.png' },
        { id: 2, type: 'proxy', name: 'USA Residential SOCKS5 Proxy', price: 50, image: 'https://cdn-icons-png.flaticon.com/512/483/483321.png' }
      ],
      orders: [],
      deposits: []
    };

    function saveState() {
      localStorage.setItem('aura_state', JSON.stringify(state));
    }

    // Get Current User ID from Telegram
    const currentUser = tg.initDataUnsafe?.user || { id: 12345678, first_name: "Demo User" };
    const userId = currentUser.id;

    if (!state.users[userId]) {
      state.users[userId] = { balance: 0.00, name: currentUser.first_name };
      saveState();
    }

    // Checking Admin Privilege
    if (userId === ADMIN_ID) {
      document.getElementById('admin-secret-btn').classList.remove('hidden');
    }

    function updateHeaderBalance() {
      document.getElementById('header-balance').innerText = state.users[userId].balance.toFixed(2);
    }

    // Navigation Switcher
    function switchTab(tab) {
      document.querySelectorAll('[id^="nav-"]').forEach(el => el.classList.remove('active-tab', 'text-purple-600'));
      document.getElementById(`nav-${tab}`).classList.add('active-tab', 'text-purple-600');
      
      const content = document.getElementById('app-content');
      if (tab === 'home') renderHome(content);
      if (tab === 'add-fund') renderAddFund(content);
      if (tab === 'orders') renderOrders(content);
      if (tab === 'profile') renderProfile(content);
      updateHeaderBalance();
    }

    // --- HOME PAGE ---
    function renderHome(container) {
      container.innerHTML = `
        <!-- Balance Card -->
        <div class="bg-purple-gradient text-white p-5 rounded-2xl shadow-lg mb-4 relative overflow-hidden">
          <p class="text-xs text-purple-200">Available Balance</p>
          <h2 class="text-3xl font-black mt-1">৳ ${state.users[userId].balance.toFixed(2)}</h2>
          <button onclick="switchTab('add-fund')" class="absolute right-4 top-1/2 -translate-y-1/2 bg-white/20 backdrop-blur-md px-4 py-2 rounded-xl text-xs font-bold border border-white/30">+ Add Fund</button>
        </div>

        <!-- Banner Announcement -->
        <div class="bg-blue-600 text-white p-4 rounded-2xl mb-6 flex justify-between items-center shadow-md">
          <div>
            <h3 class="font-bold text-sm">Big Announcement!</h3>
            <p class="text-[11px] text-blue-100">We have something new for you</p>
            <button class="bg-white text-blue-600 text-[10px] font-bold px-3 py-1 rounded-lg mt-2">Learn More →</button>
          </div>
          <div class="text-3xl opacity-80">📣</div>
        </div>

        <h3 class="font-bold text-gray-700 text-sm mb-3">Our Services</h3>

        <!-- Service Cards -->
        <div class="space-y-3">
          <!-- VPN -->
          <div class="bg-white p-3 rounded-2xl shadow-sm border flex justify-between items-center">
            <div class="flex items-center gap-3">
              <div class="p-3 bg-blue-50 text-blue-500 rounded-xl"><i class="fa-solid fa-lock text-xl"></i></div>
              <div>
                <h4 class="font-bold text-sm">VPN</h4>
                <p class="text-[10px] text-gray-400">Fast & Secure VPN</p>
              </div>
            </div>
            <button onclick="openProductModal('vpn')" class="bg-blue-50 text-blue-600 text-xs font-bold px-3 py-2 rounded-xl">View Packages →</button>
          </div>

          <!-- Proxy -->
          <div class="bg-white p-3 rounded-2xl shadow-sm border flex justify-between items-center">
            <div class="flex items-center gap-3">
              <div class="p-3 bg-purple-50 text-purple-500 rounded-xl"><i class="fa-solid fa-globe text-xl"></i></div>
              <div>
                <h4 class="font-bold text-sm">Proxy</h4>
                <p class="text-[10px] text-gray-400">High Quality Proxy</p>
              </div>
            </div>
            <button onclick="openProductModal('proxy')" class="bg-purple-50 text-purple-600 text-xs font-bold px-3 py-2 rounded-xl">View Packages →</button>
          </div>

          <!-- P2P Dollar -->
          <div class="bg-white p-3 rounded-2xl shadow-sm border flex justify-between items-center">
            <div class="flex items-center gap-3">
              <div class="p-3 bg-green-50 text-green-500 rounded-xl"><i class="fa-solid fa-arrows-rotate text-xl"></i></div>
              <div>
                <h4 class="font-bold text-sm">P2P Dollar</h4>
                <p class="text-[10px] text-gray-400">Buy & Sell Dollar</p>
              </div>
            </div>
            <button onclick="alert('P2P Exchange Service Coming Soon or Contact Support!')" class="bg-green-50 text-green-600 text-xs font-bold px-3 py-2 rounded-xl">Buy / Sell →</button>
          </div>
        </div>
      `;
    }

    // --- ADD FUND PAGE ---
    function renderAddFund(container) {
      container.innerHTML = `
        <div class="bg-white p-4 rounded-2xl border shadow-sm">
          <h3 class="font-bold text-sm mb-3">Select Payment Method</h3>
          <div class="grid grid-cols-3 gap-2 mb-4">
            <button onclick="selectMethod('bKash')" class="p-3 border rounded-xl text-center text-xs font-bold hover:border-pink-500 focus:border-pink-500">bKash</button>
            <button onclick="selectMethod('Nagad')" class="p-3 border rounded-xl text-center text-xs font-bold hover:border-orange-500 focus:border-orange-500">Nagad</button>
            <button onclick="selectMethod('Binance')" class="p-3 border rounded-xl text-center text-xs font-bold hover:border-yellow-500 focus:border-yellow-500">Binance</button>
          </div>

          <p class="text-xs text-gray-500 mb-2">Select Amount Chips:</p>
          <div class="grid grid-cols-4 gap-2 mb-4">
            <button onclick="setAmount(100)" class="p-2 border rounded-lg text-xs font-bold bg-gray-50">৳100</button>
            <button onclick="setAmount(200)" class="p-2 border rounded-lg text-xs font-bold bg-gray-50">৳200</button>
            <button onclick="setAmount(500)" class="p-2 border rounded-lg text-xs font-bold bg-gray-50">৳500</button>
            <button onclick="setAmount(1000)" class="p-2 border rounded-lg text-xs font-bold bg-gray-50">৳1000</button>
          </div>

          <input id="deposit-amount" type="number" placeholder="Enter Amount" class="w-full p-3 border rounded-xl mb-3 text-sm outline-none focus:border-purple-600">
          <input id="deposit-trx" type="text" placeholder="Transaction ID (TrxID)" class="w-full p-3 border rounded-xl mb-4 text-sm outline-none focus:border-purple-600">

          <button onclick="submitDeposit()" class="w-full bg-purple-600 text-white font-bold py-3 rounded-xl text-sm shadow-md">Submit Deposit Request</button>
        </div>
      `;
    }

    let selectedPaymentMethod = "bKash";
    function selectMethod(method) { selectedPaymentMethod = method; alert("Selected Method: " + method); }
    function setAmount(amt) { document.getElementById('deposit-amount').value = amt; }

    function submitDeposit() {
      const amt = parseFloat(document.getElementById('deposit-amount').value);
      const trx = document.getElementById('deposit-trx').value;
      if (!amt || !trx) return alert("Please fill amount & transaction ID!");

      state.deposits.push({
        id: Date.now(),
        userId: userId,
        userName: state.users[userId].name,
        amount: amt,
        method: selectedPaymentMethod,
        trx: trx,
        status: 'Pending'
      });
      saveState();
      alert("Deposit request submitted! Admin will verify soon.");
      switchTab('orders');
    }

    // --- ORDERS PAGE ---
    function renderOrders(container) {
      const myOrders = state.orders.filter(o => o.userId === userId);
      const myDeposits = state.deposits.filter(d => d.userId === userId);

      container.innerHTML = `
        <h3 class="font-bold text-sm mb-3">Deposit Requests</h3>
        <div class="space-y-2 mb-6">
          ${myDeposits.length === 0 ? '<p class="text-xs text-gray-400">No deposit history.</p>' : ''}
          ${myDeposits.map(d => `
            <div class="bg-white p-3 rounded-xl border flex justify-between items-center text-xs">
              <div>
                <p class="font-bold">${d.method} - ৳${d.amount}</p>
                <p class="text-[10px] text-gray-400">Trx: ${d.trx}</p>
              </div>
              <span class="px-2 py-1 rounded-full text-[10px] font-bold ${d.status === 'Approved' ? 'bg-green-100 text-green-700' : d.status === 'Rejected' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700'}">${d.status}</span>
            </div>
          `).join('')}
        </div>

        <h3 class="font-bold text-sm mb-3">Purchased Products</h3>
        <div class="space-y-2">
          ${myOrders.length === 0 ? '<p class="text-xs text-gray-400">No purchase history.</p>' : ''}
          ${myOrders.map(o => `
            <div class="bg-white p-3 rounded-xl border flex justify-between items-center text-xs">
              <div>
                <p class="font-bold">${o.productName} (x${o.qty})</p>
                <p class="text-[10px] text-gray-400">Duration: ${o.days} Days | Total: ৳${o.total}</p>
              </div>
              <span class="text-purple-600 font-bold">Active</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    // --- PROFILE PAGE ---
    function renderProfile(container) {
      container.innerHTML = `
        <div class="bg-white p-5 rounded-2xl border text-center shadow-sm">
          <div class="w-16 h-16 rounded-full bg-purple-100 text-purple-600 font-bold text-2xl flex items-center justify-center mx-auto mb-3">
            ${currentUser.first_name[0]}
          </div>
          <h3 class="font-bold text-base">${currentUser.first_name}</h3>
          <p class="text-xs text-gray-400 mb-4">Telegram ID: ${userId}</p>

          <div class="bg-gray-50 p-3 rounded-xl border mb-4">
            <span class="text-xs text-gray-500">Current Balance</span>
            <p class="text-2xl font-black text-purple-700">৳ ${state.users[userId].balance.toFixed(2)}</p>
          </div>
        </div>
      `;
    }

    // --- PRODUCT PURCHASE MODAL ---
    function openProductModal(type) {
      const items = state.products.filter(p => p.type === type);
      const modal = document.createElement('div');
      modal.className = "fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-end justify-center";
      modal.id = "product-modal";
      modal.innerHTML = `
        <div class="bg-white w-full max-w-md rounded-t-3xl p-5 max-h-[80vh] overflow-y-auto">
          <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold text-base capitalize">Select ${type}</h3>
            <button onclick="document.getElementById('product-modal').remove()" class="text-gray-400 font-bold">✕</button>
          </div>
          <div class="space-y-3">
            ${items.length === 0 ? '<p class="text-xs text-gray-400">No products available.</p>' : ''}
            ${items.map(item => `
              <div class="p-3 border rounded-xl flex items-center gap-3">
                <img src="${item.image}" class="w-10 h-10 object-contain rounded-lg">
                <div class="flex-1">
                  <h4 class="font-bold text-xs">${item.name}</h4>
                  <p class="text-xs text-purple-600 font-bold">৳${item.price}/day</p>
                </div>
                <button onclick="buyProduct(${item.id})" class="bg-purple-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg">Buy</button>
              </div>
            `).join('')}
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    }

    function buyProduct(prodId) {
      const prod = state.products.find(p => p.id === prodId);
      const days = parseInt(prompt("কয়দিনের জন্য কিনবেন (Days)?", "1")) || 1;
      const qty = parseInt(prompt("কয়টা কিনবেন (Quantity)?", "1")) || 1;
      const totalPrice = prod.price * days * qty;

      if (state.users[userId].balance < totalPrice) {
        return alert(`পর্যাপ্ত ব্যালেন্স নেই! মোট লাগবে: ৳${totalPrice}`);
      }

      state.users[userId].balance -= totalPrice;
      state.orders.push({
        id: Date.now(),
        userId: userId,
        productName: prod.name,
        days: days,
        qty: qty,
        total: totalPrice
      });
      saveState();
      alert("পণ্য সফলভাবে কেনা হয়েছে!");
      document.getElementById('product-modal').remove();
      switchTab('orders');
    }

    // --- ADMIN PANEL ---
    function openAdminPanel() {
      const container = document.getElementById('app-content');
      container.innerHTML = `
        <div class="bg-white p-4 rounded-2xl border shadow-md mb-6">
          <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold text-red-600 text-sm">⚙️ Secret Admin Panel</h3>
            <button onclick="switchTab('home')" class="text-xs bg-gray-200 px-2 py-1 rounded">Exit</button>
          </div>

          <!-- Add Product -->
          <div class="border-t pt-3 mb-4">
            <h4 class="font-bold text-xs mb-2">Add New Product (VPN/Proxy)</h4>
            <select id="adm-type" class="w-full p-2 border rounded-lg text-xs mb-2">
              <option value="vpn">VPN</option>
              <option value="proxy">Proxy</option>
            </select>
            <input id="adm-name" type="text" placeholder="Product Name" class="w-full p-2 border rounded-lg text-xs mb-2">
            <input id="adm-price" type="number" placeholder="Price Per Day (BDT)" class="w-full p-2 border rounded-lg text-xs mb-2">
            <input id="adm-img" type="text" placeholder="Image URL" class="w-full p-2 border rounded-lg text-xs mb-3">
            <button onclick="adminAddProduct()" class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg text-xs">Add Product</button>
          </div>

          <!-- Deposit Requests -->
          <div class="border-t pt-3">
            <h4 class="font-bold text-xs mb-2">Manage Deposit Requests</h4>
            <div class="space-y-2">
              ${state.deposits.filter(d => d.status === 'Pending').length === 0 ? '<p class="text-[10px] text-gray-400">No pending requests.</p>' : ''}
              ${state.deposits.filter(d => d.status === 'Pending').map(d => `
                <div class="p-2 border rounded-lg bg-gray-50 text-xs">
                  <p><b>User:</b> ${d.userName} (${d.userId})</p>
                  <p><b>Amount:</b> ৳${d.amount} (${d.method})</p>
                  <p><b>TrxID:</b> ${d.trx}</p>
                  <div class="flex gap-2 mt-2">
                    <button onclick="processDeposit(${d.id}, true)" class="flex-1 bg-green-600 text-white py-1 rounded text-[10px] font-bold">Approve</button>
                    <button onclick="processDeposit(${d.id}, false)" class="flex-1 bg-red-600 text-white py-1 rounded text-[10px] font-bold">Reject</button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function adminAddProduct() {
      const type = document.getElementById('adm-type').value;
      const name = document.getElementById('adm-name').value;
      const price = parseFloat(document.getElementById('adm-price').value);
      const img = document.getElementById('adm-img').value || 'https://cdn-icons-png.flaticon.com/512/2885/2885440.png';

      if (!name || !price) return alert("Product Name and Price are required!");

      state.products.push({ id: Date.now(), type: type, name: name, price: price, image: img });
      saveState();
      alert("Product Added Successfully!");
      openAdminPanel();
    }

    function processDeposit(depId, isApprove) {
      const dep = state.deposits.find(d => d.id === depId);
      if (!dep) return;

      if (isApprove) {
        dep.status = 'Approved';
        state.users[dep.userId].balance += dep.amount;
        alert("Deposit Approved & Balance Added!");
      } else {
        dep.status = 'Rejected';
        alert("Deposit Request Rejected!");
      }
      saveState();
      openAdminPanel();
    }

    // Default Load
    switchTab('home');
  </script>
</body>
</html>
