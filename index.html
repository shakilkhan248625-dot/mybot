<!-- Select Payment Method Section -->
<div class="px-4 py-3">
  <h3 class="text-gray-800 font-semibold mb-3">Select Payment Method to Proceed</h3>
  
  <div class="grid grid-cols-2 gap-4">
    
    <!-- bKash Card -->
    <div onclick="selectMethod('bkash')" class="bg-white border rounded-2xl p-4 flex flex-col items-center justify-center shadow-sm cursor-pointer hover:border-purple-600 transition">
      <img src="https://i.ibb.co/bkash-logo.png" alt="bKash" class="h-10 mb-2 object-contain">
      <span class="font-bold text-gray-800">bKash</span>
      <span class="text-xs text-purple-600 font-medium">Pay Now</span>
    </div>

    <!-- Nagad Card -->
    <div onclick="selectMethod('nagad')" class="bg-white border rounded-2xl p-4 flex flex-col items-center justify-center shadow-sm cursor-pointer hover:border-purple-600 transition">
      <img src="https://i.ibb.co/nagad-logo.png" alt="Nagad" class="h-10 mb-2 object-contain">
      <span class="font-bold text-gray-800">Nagad</span>
      <span class="text-xs text-purple-600 font-medium">Pay Now</span>
    </div>

    <!-- Rocket Card -->
    <div onclick="selectMethod('rocket')" class="bg-white border rounded-2xl p-4 flex flex-col items-center justify-center shadow-sm cursor-pointer hover:border-purple-600 transition">
      <img src="https://i.ibb.co/rocket-logo.png" alt="Rocket" class="h-10 mb-2 object-contain">
      <span class="font-bold text-gray-800">Rocket</span>
      <span class="text-xs text-purple-600 font-medium">Pay Now</span>
    </div>

    <!-- Binance Card -->
    <div onclick="selectMethod('binance')" class="bg-white border rounded-2xl p-4 flex flex-col items-center justify-center shadow-sm cursor-pointer hover:border-purple-600 transition">
      <img src="https://i.ibb.co/binance-logo.png" alt="Binance" class="h-10 mb-2 object-contain">
      <span class="font-bold text-gray-800">Binance</span>
      <span class="text-xs text-purple-600 font-medium">Pay Now</span>
    </div>

  </div>
</div>
