<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AURA STORE</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6fb;
      color: #1f2937;
      padding-bottom: 90px;
    }

    .app {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
    }

    .header {
      background: linear-gradient(135deg, #171c35, #292052);
      color: white;
      padding: 25px 20px;
      border-radius: 0 0 25px 25px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 45px;
      height: 45px;
      border-radius: 14px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .notification {
      width: 45px;
      height: 45px;
      background: rgba(255,255,255,.12);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .balance-card {
      margin-top: 25px;
      background: rgba(255,255,255,.1);
      padding: 20px;
      border-radius: 20px;
    }

    .balance-card p {
      color: #cbd5e1;
      font-size: 14px;
    }

    .balance {
      font-size: 36px;
      font-weight: bold;
      margin: 8px 0 18px;
    }

    .add-fund {
      border: none;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: white;
      padding: 13px 25px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      width: 100%;
    }

    .content {
      padding: 20px;
    }

    .section-title {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .services {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .service-card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .service-icon {
      font-size: 35px;
      margin-bottom: 15px;
    }

    .service-card h3 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .service-card p {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .buy-btn {
      margin-top: 15px;
      border: none;
      width: 100%;
      padding: 11px;
      border-radius: 12px;
      background: #1f2937;
      color: white;
      font-weight: bold;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-around;
      padding: 12px 5px;
    }

    .nav-item {
      text-align: center;
      font-size: 12px;
      color: #64748b;
      cursor: pointer;
    }

    .nav-icon {
      font-size: 22px;
      display: block;
      margin-bottom: 3px;
    }

    .active {
      color: #2563eb;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">

    <div class="top">

      <div class="logo">
        <div class="logo-icon">⚡</div>

        <div>
          <h2>AURA STORE</h2>
          <small>Digital Services</small>
        </div>
      </div>

      <div class="notification">🔔</div>

    </div>

    <div class="balance-card">

      <p>Your Balance</p>

      <div class="balance">$0.00</div>

      <button class="add-fund">
        ➕ ADD FUND
      </button>

    </div>

  </div>

  <div class="content">

    <div class="section-title">
      🛍 Our Services
    </div>

    <div class="services">

      <div class="service-card">

        <div class="service-icon">🔐</div>

        <h3>VPN</h3>

        <p>Fast & Secure VPN</p>

        <button class="buy-btn">
          View Packages
        </button>

      </div>

      <div class="service-card">

        <div class="service-icon">🌐</div>

        <h3>Proxy</h3>

        <p>High Quality Proxy</p>

        <button class="buy-btn">
          View Packages
        </button>

      </div>

    </div>

  </div>

</div>

<div class="bottom-nav">

  <div class="nav-item active">
    <span class="nav-icon">🏠</span>
    Home
  </div>

  <div class="nav-item">
    <span class="nav-icon">🛍</span>
    Store
  </div>

  <div class="nav-item">
    <span class="nav-icon">➕</span>
    Add Fund
  </div>

  <div class="nav-item">
    <span class="nav-icon">📦</span>
    Orders
  </div>

  <div class="nav-item">
    <span class="nav-icon">👤</span>
    Profile
  </div>

</div>

</body>
</html>
