<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXORA - DIGITAL SERVICES</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f6fb;
            --card-bg: #ffffff;
            --primary-purple: #6c5ce7;
            --primary-blue: #0984e3;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --radius-lg: 20px;
            --radius-md: 16px;
            --shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 430px;
            background: var(--bg-color);
            min-height: 100vh;
            padding: 14px;
            padding-bottom: 90px;
            position: relative;
        }

        /* 1. Top Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 18px;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.25);
        }

        .brand-text h1 {
            font-size: 16px;
            font-weight: 800;
            color: #0f172a;
            line-height: 1;
        }

        .brand-text span {
            font-size: 8px;
            font-weight: 700;
            color: #7c3aed;
            letter-spacing: 0.5px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            background: var(--card-bg);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: var(--shadow);
            color: #475569;
            cursor: pointer;
            font-size: 14px;
        }

        .notification-dot {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 7px;
            height: 7px;
            background-color: #ef4444;
            border-radius: 50%;
            border: 2px solid white;
        }

        .balance-badge {
            background: var(--card-bg);
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: var(--shadow);
            font-weight: 700;
            font-size: 13px;
            color: #0f172a;
            white-space: nowrap;
        }

        .balance-badge i {
            color: #7c3aed;
            font-size: 14px;
        }

        /* 2. Main Balance Card */
        .main-balance-card {
            background: linear-gradient(135deg, #6c5ce7, #4834d4);
            border-radius: var(--radius-lg);
            padding: 18px 20px;
            color: white;
            box-shadow: 0 10px 20px -5px rgba(108, 92, 231, 0.4);
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .main-balance-card::after {
            content: '';
            position: absolute;
            right: -20px;
            bottom: -20px;
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }
