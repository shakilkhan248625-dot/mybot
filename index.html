<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA STORE Mini App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            padding-bottom: 80px;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
        }

        /* Titles */
        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        /* Partners Section */
        .partners-section {
            background-color: #161b22;
            border: 1px solid #21262d;
            border-radius: 16px;
            padding: 18px;
        }

        .partners-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 14px;
        }

        .partner-item {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 14px;
            padding: 14px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .partner-item:hover {
            border-color: #6366f1;
            transform: translateY(-2px);
        }

        .partner-img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .partner-item span {
            font-size: 12px;
            color: #c9d1d9;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Partners Section -->
        <div class="partners-section">
            <div class="section-title">🤝 Our Official Partners</div>
            <div class="partners-grid">
                
                <!-- Real bKash Bird Logo -->
                <div class="partner-item">
                    <svg class="partner-img" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="46" fill="#D81B60"/>
                        <path d="M22 46L44 26L41 55L22 46Z" fill="white"/>
                        <path d="M44 26L78 30L52 50L44 26Z" fill="white"/>
                        <path d="M41 55L78 30L55 74L41 55Z" fill="white"/>
                        <path d="M55 74L68 56L78 68L55 74Z" fill="white"/>
                    </svg>
                    <span>bKash</span>
                </div>

                <!-- Real Nagad Text Logo Icon -->
                <div class="partner-item">
                    <svg class="partner-img" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="100" height="100" rx="20" fill="#F74B26"/>
                        <path d="M20 30 C30 20, 70 20, 80 30 C85 45, 80 75, 50 82 C25 75, 15 50, 20 30 Z" fill="#E02A00"/>
                        <!-- White Bangla Letter Representation -->
                        <path d="M32 40 C32 35, 42 35, 42 42 L42 62 M42 45 C48 38, 62 38, 62 48 L62 62 M62 48 C68 40, 75 42, 75 50 L75 62" stroke="white" stroke-width="6" stroke-linecap="round" fill="none"/>
                        <circle cx="36" cy="58" r="4" fill="white"/>
                    </svg>
                    <span>Nagad</span>
                </div>

                <!-- Real Binance Logo -->
                <div class="partner-item">
                    <svg class="partner-img" viewBox="0 0 24 24" fill="#F0B90B" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L8.35 5.65l2.25 2.25L12 6.5l1.4 1.4 2.25-2.25L12 2zm-6.35 6.35L2 12l3.65 3.65 2.25-2.25L6.5 12l1.4-1.4-2.25-2.25zM12 17.5l-1.4-1.4-2.25 2.25L12 22l3.65-3.65-2.25-2.25-1.4 1.4zm5.65-11.85l-2.25 2.25 1.4 1.4 1.4-1.4 2.25 2.25L22 12l-3.65-3.65zM12 9.5L9.5 12l2.5 2.5 2.5-2.5L12 9.5z"/>
                    </svg>
                    <span>Binance</span>
                </div>

                <!-- Telegram -->
                <div class="partner-item">
                    <i class="fa-brands fa-telegram" style="font-size: 36px; color: #229ED9;"></i>
                    <span>Telegram</span>
                </div>

                <!-- OWL Proxy -->
                <div class="partner-item">
                    <i class="fa-solid fa-owl" style="font-size: 34px; color: #f59e0b;"></i>
                    <span>OWL Proxy</span>
                </div>

                <!-- VPN Partner -->
                <div class="partner-item">
                    <i class="fa-solid fa-shield-halved" style="font-size: 34px; color: #10b981;"></i>
                    <span>VPN</span>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
