<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA STORE Mini App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            padding-bottom: 80px;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .brand-text h1 { font-size: 22px; font-weight: 700; }
        .brand-text p { font-size: 13px; color: #9ca3af; }

        /* Balance Card */
        .balance-card {
            background: linear-gradient(180deg, #1e1b4b 0%, #0f172a 100%);
            border: 1px solid #312e81;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-bottom: 24px;
        }

        .balance-card h2 { font-size: 36px; margin: 6px 0 14px 0; }

        .add-fund-btn {
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Titles */
        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        /* Services Grid */
        .services-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 28px;
        }

        .service-card {
            background-color: #161b22;
            border: 1px solid #21262d;
            border-radius: 16px;
            padding: 20px 14px;
            text-align: center;
        }

        .btn-view {
            background-color: #0d1117;
            color: #e6edf3;
            border: 1px solid #30363d;
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }

        /* Partners Section */
        .partners-section {
            background-color: #161b22;
            border: 1px solid #21262d;
            border-radius: 16px;
            padding: 18px;
        }

        .partners-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 14px;
        }

        .partner-item {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 14px;
            padding: 14px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .partner-item:hover {
            border-color: #6366f1;
            transform: translateY(-2px);
        }

        .svg-icon {
            width: 34px;
            height: 34px;
        }

        .partner-item span {
            font-size: 12px;
            color: #c9d1d9;
            font-weight: 600;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #161b22;
            border-top: 1px solid #21262d;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            max-width: 480px;
            margin: 0 auto;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #8b949e;
            font-size: 11px;
            text-decoration: none;
            gap: 4px;
        }

        .nav-item.active { color: #58a6ff; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="brand-icon">⚡</div>
            <div class="brand-text">
                <h1>AURA STORE</h1>
                <p>Digital Services</p>
            </div>
        </div>

        <!-- Balance Card -->
        <div class="balance-card">
            <p>Your Balance</p>
            <h2>$0.00</h2>
            <button class="add-fund-btn"><i class="fa-solid fa-plus"></i> ADD FUND</button>
        </div>

        <!-- Services -->
        <div class="section-title">🛍️ Our Services</div>
        <div class="services-grid">
            <div class="service-card">
                <div style="font-size:32px; margin-bottom:8px;">🔐</div>
                <h3 style="margin-bottom:10px;">VPN</h3>
                <button class="btn-view">View Packages</button>
            </div>
            <div class="service-card">
                <div style="font-size:32px; margin-bottom:8px;">🌐</div>
                <h3 style="margin-bottom:10px;">Proxy</h3>
                <button class="btn-view">View Packages</button>
            </div>
        </div>

        <!-- Guaranteed SVG Logo Partners Section -->
        <div class="partners-section">
            <div class="section-title">🤝 Our Official Partners</div>
            <div class="partners-grid">
                
                <!-- bKash Vector Logo -->
                <div class="partner-item">
                    <svg class="svg-icon" viewBox="0 0 100 100">
                        <path d="M50 0 C22.4 0 0 22.4 0 50 C0 77.6 22.4 100 50 100 C77.6 100 100 77.6 100 50 C100 22.4 77.6 0 50 0 Z" fill="#E2136E"/>
                        <path d="M28 30 L45 30 L60 55 L35 70 Z" fill="#FFFFFF"/>
                        <path d="M48 30 L72 30 L55 52 Z" fill="#FFFFFF"/>
                        <path d="M48 56 L72 70 L60 70 Z" fill="#FFFFFF"/>
                    </svg>
                    <span>bKash</span>
                </div>

                <!-- Nagad Vector Logo -->
                <div class="partner-item">
                    <svg class="svg-icon" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="48" fill="#F7931E"/>
                        <path d="M25 65 C 25 35, 40 25, 55 25 C 70 25, 75 35, 75 50 C 75 65, 60 75, 45 75 C 30 75, 25 65, 25 65 Z" fill="#E61C24"/>
                        <circle cx="50" cy="50" r="14" fill="#FFFFFF"/>
                    </svg>
                    <span>Nagad</span>
                </div>

                <!-- Binance Vector Logo -->
                <div class="partner-item">
                    <svg class="svg-icon" viewBox="0 0 24 24" fill="#F0B90B">
                        <path d="M12 2L8.35 5.65l2.25 2.25L12 6.5l1.4 1.4 2.25-2.25L12 2zm-6.35 6.35L2 12l3.65 3.65 2.25-2.25L6.5 12l1.4-1.4-2.25-2.25zM12 17.5l-1.4-1.4-2.25 2.25L12 22l3.65-3.65-2.25-2.25-1.4 1.4zm5.65-11.85l-2.25 2.25 1.4 1.4 1.4-1.4 2.25 2.25L22 12l-3.65-3.65zM12 9.5L9.5 12l2.5 2.5 2.5-2.5L12 9.5z"/>
                    </svg>
                    <span>Binance</span>
                </div>

                <!-- Telegram -->
                <div class="partner-item">
                    <i class="fa-brands fa-telegram" style="font-size: 34px; color: #229ED9;"></i>
                    <span>Telegram</span>
                </div>

                <!-- OWL Proxy -->
                <div class="partner-item">
                    <i class="fa-solid fa-owl" style="font-size: 32px; color: #f59e0b;"></i>
                    <span>OWL Proxy</span>
                </div>

                <!-- VPN Partner -->
                <div class="partner-item">
                    <i class="fa-solid fa-shield-halved" style="font-size: 32px; color: #10b981;"></i>
                    <span>VPN</span>
                </div>

            </div>
        </div>
    </div>

    <!-- Navigation -->
    <div class="bottom-nav">
        <a href="#" class="nav-item active"><i class="fa-solid fa-house"></i>Home</a>
        <a href="#" class="nav-item"><i class="fa-solid fa-bag-shopping"></i>Store</a>
        <a href="#" class="nav-item"><i class="fa-solid fa-square-plus"></i>Add Fund</a>
        <a href="#" class="nav-item"><i class="fa-solid fa-box"></i>Orders</a>
        <a href="#" class="nav-item"><i class="fa-solid fa-user"></i>Profile</a>
    </div>

</body>
</html>
