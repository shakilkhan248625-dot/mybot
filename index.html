<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA - DIGITAL SERVICES</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F4F6F9;
            --card-bg: #FFFFFF;
            --primary-purple: #6C5CE7;
            --primary-teal: #00CEC9;
            --primary-blue: #0984E3;
            --text-dark: #2D3436;
            --text-muted: #636E72;
            --border-radius-lg: 20px;
            --border-radius-md: 14px;
            --shadow-soft: 0 8px 24px rgba(149, 157, 165, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* App Wrapper (Mobile View Frame) */
        .app-container {
            width: 100%;
            max-width: 430px;
            background: #F8FAFC;
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 90px;
            position: relative;
        }

        /* Top Bar Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #6C5CE7, #81ECEC);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 20px;
            box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
        }

        .brand-text h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #1E293B;
            line-height: 1;
        }

        .brand-text span {
            font-size: 8px;
            font-weight: 600;
            color: var(--primary-purple);
            letter-spacing: 1px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            background: var(--card-bg);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: var(--shadow-soft);
            color: #475569;
            cursor: pointer;
        }

        .notification-dot {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 8px;
            height: 8px;
            background-color: #FF7675;
            border-radius: 50%;
            border: 2px solid white;
        }

        .balance-badge {
            background: var(--card-bg);
            padding: 8px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: var(--shadow-soft);
            font-weight: 700;
            font-size: 14px;
            color: #1E293B;
        }

        .balance-badge i {
            color: var(--primary-purple);
            font-size: 16px;
        }

        /* User Profile Card */
        .profile-card {
            background: var(--card-bg);
            border-radius: var(--border-radius-lg);
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: var(--shadow-soft);
            margin-bottom: 20px;
            position: relative;
        }

        .avatar {
            width: 56px;
            height: 56px;
            background: #E2E8F0;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #94A3B8;
            font-size: 28px;
        }

        .user-details h3 {
            font-size: 16px;
            font-weight: 700;
            color: #0F172A;
            margin-bottom: 2px;
        }

        .username {
            font-size: 13px;
            color: var(--primary-blue);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 6px;
        }

        .badge-verified {
            background: #EDF2F7;
            color: var(--primary-purple);
            font-size: 10px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .arrow-right {
            position: absolute;
            right: 16px;
            color: #94A3B8;
            font-size: 14px;
        }
