<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA STORE Mini App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            padding-bottom: 80px;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
        }

        /* Titles */
        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        /* Partners Section */
        .partners-section {
            background-color: #161b22;
            border: 1px solid #21262d;
            border-radius: 16px;
            padding: 18px;
        }

        .partners-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 14px;
        }

        .partner-item {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 14px;
            padding: 14px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .partner-item:hover {
            border-color: #6366f1;
            transform: translateY(-2px);
        }

        .partner-img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            border-radius: 8px;
        }

        .partner-item span {
            font-size: 12px;
            color: #c9d1d9;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Official Partners Section -->
        <div class="partners-section">
            <div class="section-title">🤝 Our Official Partners</div>
            <div class="partners-grid">
                
                <!-- bKash Image Link -->
                <div class="partner-item">
                    <img class="partner-img" src="https://share.google/0UaS2B5dc4PZO4IoH" alt="bKash">
                    <span>bKash</span>
                </div>

                <!-- Nagad Image Link -->
                <div class="partner-item">
                    <img class="partner-img" src="https://share.google/3NNDBKzhgu8gqvw2T" alt="Nagad">
                    <span>Nagad</span>
                </div>

                <!-- Binance Logo -->
                <div class="partner-item">
                    <svg class="partner-img" viewBox="0 0 24 24" fill="#F0B90B" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L8.35 5.65l2.25 2.25L12 6.5l1.4 1.4 2.25-2.25L12 2zm-6.35 6.35L2 12l3.65 3.65 2.25-2.25L6.5 12l1.4-1.4-2.25-2.25zM12 17.5l-1.4-1.4-2.25 2.25L12 22l3.65-3.65-2.25-2.25-1.4 1.4zm5.65-11.85l-2.25 2.25 1.4 1.4 1.4-1.4 2.25 2.25L22 12l-3.65-3.65zM12 9.5L9.5 12l2.5 2.5 2.5-2.5L12 9.5z"/>
                    </svg>
                    <span>Binance</span>
                </div>

                <!-- Telegram -->
                <div class="partner-item">
                    <i class="fa-brands fa-telegram" style="font-size: 36px; color: #229ED9;"></i>
                    <span>Telegram</span>
                </div>

                <!-- OWL Proxy -->
                <div class="partner-item">
                    <i class="fa-solid fa-owl" style="font-size: 34px; color: #f59e0b;"></i>
                    <span>OWL Proxy</span>
                </div>

                <!-- VPN Partner -->
                <div class="partner-item">
                    <i class="fa-solid fa-shield-halved" style="font-size: 34px; color: #10b981;"></i>
                    <span>VPN</span>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
