<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA STORE Mini App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            padding-bottom: 80px;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .brand-text h1 { font-size: 22px; font-weight: 700; }
        .brand-text p { font-size: 13px; color: #9ca3af; }

        /* Balance Card */
        .balance-card {
            background: linear-gradient(180deg, #1e1b4b 0%, #0f172a 100%);
            border: 1px solid #312e81;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-bottom: 24px;
        }

        .balance-card h2 { font-size: 36px; margin: 6px 0 14px 0; }

        .add-fund-btn {
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Titles */
        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        /* Services Grid */
        .services-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 28px;
        }

        .service-card {
            background-color: #161b22;
            border: 1px solid #21262d;
            border-radius: 16px;
            padding: 20px 14px;
            text-align: center;
        }

        .btn-view {
            background-color: #0d1117;
            color: #e6edf3;
            border: 1px solid #30363d;
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }

        /* Partners Section */
        .partners-section {
            background-color: #161b22;
            border: 1px solid #21262d;
            border-radius: 16px;
            padding: 18px;
        }

        .partners-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 14px;
        }

        .partner-item {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 14px;
            padding: 14px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .partner-item:hover {
            border-color: #6366f1;
            transform: translateY(-2px);
        }

        .partner-img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        .partner-item span {
            font-size: 12px;
            color: #c9d1d9;
            font-weight: 600;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #161b22;
            border-top: 1px solid #21262d;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            max-width: 480px;
            margin: 0 auto;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #8b949e;
            font-size: 11px;
            text-decoration: none;
            gap: 4px;
        }

        .nav-item.active { color: #58a6ff; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="brand-icon">⚡</div>
            <div class="brand-text">
                <h1>AURA STORE</h1>
                <p>Digital Services</p>
            </div>
        </div>

        <!-- Balance Card -->
        <div class="balance-card">
            <p>Your Balance</p>
            <h2>$0.00</h2>
            <button class="add-fund-btn"><i class="fa-solid fa-plus"></i> ADD FUND</button>
        </div>

        <!-- Services -->
        <div class="section-title">🛍️ Our Services</div>
        <div class="services-grid">
            <div class="service-card">
                <div style="font-size:32px; margin-bottom:8px;">🔐</div>
                <h3 style="margin-bottom:10px;">VPN</h3>
                <button class="btn-view">View Packages</button>
            </div>
            <div class="service-card">
                <div style="font-size:32px; margin-bottom:8px;">🌐</div>
                <h3 style="margin-bottom:10px;">Proxy</h3>
                <button class="btn-view">View Packages</button>
            </div>
        </div>

        <!-- Real Logo Partners Section -->
        <div class="partners-section">
            <div class="section-title">🤝 Our Official Partners</div>
            <div class="partners-grid">
                
                <!-- bKash -->
                <div class="partner-item">
                    <img src="https://raw.githubusercontent.com/ziad-c/bd-payment-icons/main/bkash.png" class="partner-img" alt="bKash">
                    <span>bKash</span>
                </div>

                <!-- Nagad -->
                <div class="partner-item">
                    <img src="https://raw.githubusercontent.com/ziad-c/bd-payment-icons/main/nagad.png" class="partner-img" alt="Nagad">
                    <span>Nagad</span>
                </div>

                <!-- Binance -->
                <div class="partner-item">
                    <img src="https://assets.coingecko.com/coins/images/825/large/bnb-icon2_2x.png" class="partner-img" alt="Binance">
                    <span>Binance</span>
                </div>

                <!-- Telegram -->
                <div class="partner-item">
                    <i class="fa-brands fa-telegram" style="font-size: 34px; color: #229ED9;"></i>
                    <span>Telegram</span>
                </div>

                <!-- OWL Proxy -->
                <div class="partner-item">
                    <i class="fa-solid fa-owl" style="font-size: 32px; color: #f59e0b;"></i>
                    <span>OWL Proxy</span>
                </div>

                <!-- VPN Partner -->
                <div class="partner-item">
                    <i class="fa-solid fa-shield-halved" style="font-size: 32px; color: #10b981;"></i>
                    <span>VPN</span>
                </div>

            </div>
        </div>
    </div>

    <!-- Navigation -->
    <div class="bottom-nav">
        <a href="#" class="nav-item active"><i class="fa-solid fa-house"></i>Home</a>
        <a href="#" class="nav-item"><i class="fa-solid fa-bag-shopping"></i>Store</a>
        <a href="#" class="nav-item"><i class="fa-solid fa-square-plus"></i>Add Fund</a>
        <a href="#" class="nav-item"><i class="fa-solid fa-box"></i>Orders</a>
        <a href="#" class="nav-item"><i class="fa-solid fa-user"></i>Profile</a>
    </div>

</body>
    </html>
