<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AURA STORE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f6fb;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --primary-purple: #7c3aed;
            --radius-lg: 18px;
            --radius-md: 14px;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 430px;
            background: var(--bg-color);
            min-height: 100vh;
            padding: 14px;
            padding-bottom: 85px;
            position: relative;
        }

        /* 1. Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(124, 58, 237, 0.2);
        }

        .brand-text h1 {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-dark);
            line-height: 1;
        }

        .brand-text span {
            font-size: 8px;
            font-weight: 700;
            color: var(--primary-purple);
            letter-spacing: 0.5px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            width: 34px;
            height: 34px;
            background: var(--card-bg);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: var(--shadow);
            color: #475569;
            cursor: pointer;
            font-size: 13px;
        }

        .notification-dot {
            position: absolute;
            top: 7px;
            right: 7px;
            width: 7px;
            height: 7px;
            background-color: #ef4444;
            border-radius: 50%;
            border: 2px solid white;
        }

        .balance-badge {
            background: var(--card-bg);
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: var(--shadow);
            font-weight: 700;
            font-size: 12px;
            color: var(--text-dark);
            white-space: nowrap;
        }

        .balance-badge i {
            color: var(--primary-purple);
            font-size: 13px;
        }

        /* 2. Balance Display Card */
        .main-balance-card {
            background: linear-gradient(135deg, #6c5ce7, #4834d4);
            border-radius: var(--radius-lg);
            padding: 16px 18px;
            color: white;
            box-shadow: 0 8px 18px rgba(108, 92, 231, 0.3);
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .balance-info p {
            font-size: 11px;
            opacity: 0.85;
            font-weight: 500;
        }

        .balance-info h2 {
            font-size: 24px;
            font-weight: 800;
            margin-top: 2px;
        }

        .add-balance-btn {
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        /* 3. Carousel Banner */
        .carousel-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            margin-bottom: 6px;
        }

        .carousel-container::-webkit-scrollbar { display: none; }

        .banner-card {
            min-width: 250px;
            height: 105px;
            border-radius: var(--radius-md);
            padding: 12px 14px;
            color: white;
            position: relative;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-shrink: 0;
            overflow: hidden;
        }

        .banner-1 { background: linear-gradient(135deg, #4338ca, #6366f1); }
        .banner-2 { background: linear-gradient(135deg, #0d9488, #14b8a6); }
        .banner-3 { background: linear-gradient(135deg, #0284c7, #38bdf8); }

        .banner-card h4 { font-size: 13px; font-weight: 700; }
        .banner-card p { font-size: 10px; opacity: 0.9; }

        .banner-btn {
            background: white;
            border: none;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            width: fit-content;
        }

        .banner-1 .banner-btn { color: #4338ca; }
        .banner-2 .banner-btn { color: #0d9488; }
        .banner-3 .banner-btn { color: #0284c7; }

        .banner-icon {
            position: absolute;
            right: 8px;
            bottom: 4px;
            font-size: 40px;
            opacity: 0.25;
        }

        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-bottom: 16px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: #cbd5e1;
            border-radius: 50%;
        }

        .dot.active {
            background: var(--primary-purple);
            width: 14px;
            border-radius: 10px;
        }

        /* 4. Services List */
        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .services-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 14px;
        }

        .service-card {
            background: var(--card-bg);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .service-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .service-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .vpn-icon { background: #e0f2fe; color: #0284c7; }
        .proxy-icon { background: #f3e8ff; color: #9333ea; }
        .p2p-icon { background: #dcfce7; color: #16a34a; }

        .service-text h4 {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .service-text p {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .action-btn {
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .vpn-btn { background: #e0f2fe; color: #0284c7; }
        .proxy-btn { background: #f3e8ff; color: #9333ea; }
        .p2p-btn { background: #dcfce7; color: #16a34a; }

        /* Add Fund Bar */
        .add-fund-card {
            background: var(--card-bg);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
            cursor: pointer;
        }

        .add-fund-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .fund-icon {
            width: 36px;
            height: 36px;
            background: #e0f2fe;
            color: #0284c7;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 15px;
        }

        .fund-text h4 { font-size: 12px; font-weight: 700; color: var(--text-dark); }
        .fund-text p { font-size: 10px; color: var(--text-muted); }

        .fund-arrow {
            width: 28px;
            height: 28px;
            background: #f1f5f9;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #0284c7;
            font-size: 11px;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.04);
            border-top: 1px solid #f1f5f9;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            text-decoration: none;
            color: #94a3b8;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .nav-item i { font-size: 16px; }
        .nav-item.active { color: var(--primary-purple); }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(3px);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
        }

        .modal-card {
            background: white;
            width: 100%;
            max-width: 430px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 18px;
            animation: slideUp 0.25s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .modal-header h3 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .close-btn {
            background: #f1f5f9;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #64748b;
            cursor: pointer;
        }

        .payment-methods {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }

        .payment-option {
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            color: #334155;
        }

        .payment-option.selected {
            border-color: var(--primary-purple);
            background: #f3e8ff;
            color: var(--primary-purple);
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            font-weight: 600;
        }

        .input-group input:focus {
            border-color: var(--primary-purple);
        }

        .submit-deposit-btn {
            width: 100%;
            background: linear-gradient(135deg, #7c3aed, #4834d4);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="header">
            <div class="brand-logo">
                <div class="logo-icon"><i class="fa-solid fa-shapes"></i></div>
                <div class="brand-text">
                    <h1>NEXORA</h1>
                    <span>✦ DIGITAL SERVICES ✦</span>
                </div>
            </div>
            <div class="header-actions">
                <div class="icon-btn">
                    <i class="fa-regular fa-bell"></i>
                    <span class="notification-dot"></span>
                </div>
                <div class="balance-badge">
                    <i class="fa-solid fa-wallet"></i>
                    <span>৳ 0.00</span>
                </div>
            </div>
        </header>

        <div class="main-balance-card">
            <div class="balance-info">
                <p>Available Balance</p>
                <h2>৳ 0.00</h2>
            </div>
            <div class="add-balance-btn" onclick="openDepositModal()">
                <i class="fa-solid fa-plus"></i> Add Fund
            </div>
        </div>

        <div class="carousel-container">
            <div class="banner-card banner-1">
                <div>
                    <h4>Big Announcement!</h4>
                    <p>We have something new for you</p>
                </div>
                <button class="banner-btn">
