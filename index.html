<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quick Store Bot</title>
<style>
:root{
  --bg:#0b1420;
  --panel:#243140;
  --panel2:#1b2735;
  --text:#eef4fb;
  --muted:#9daaba;
  --green:#328c2d;
  --blue:#2879b5;
  --purple:#7044c8;
  --red:#b64040;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0; min-height:100vh; background:radial-gradient(circle at 15% 5%,#1d3a57 0,#0b1420 34%,#08111c 100%);
  color:var(--text); font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
.app{max-width:680px;margin:auto;min-height:100vh;padding:14px 16px 24px}
.header{
  display:flex;align-items:center;gap:12px;padding:10px 4px 16px;border-bottom:1px solid rgba(255,255,255,.06)
}
.avatar{
  width:64px;height:64px;border-radius:50%;background:linear-gradient(145deg,#fff,#dce5ef);
  display:grid;place-items:center;color:#174b89;font-size:28px;font-weight:900;box-shadow:0 4px 20px #0007
}
.title{flex:1}.title h1{margin:0;font-size:28px;letter-spacing:.2px}.title p{margin:4px 0 0;color:var(--muted);font-size:17px}
.dotmenu{font-size:34px;color:#fff;padding:8px}
.status{
  margin:12px 4px 18px;padding:20px;border-radius:22px;
  background:linear-gradient(135deg,#1e6395,#3195cf);font-size:22px;font-weight:700;
  box-shadow:0 10px 28px #0005
}
.chat{display:flex;flex-direction:column;gap:10px;padding:0 6px}
.msg{max-width:82%;padding:18px 20px;border-radius:24px;background:#293745;font-size:22px;font-weight:700;line-height:1.35}
.msg.right{align-self:flex-end;background:linear-gradient(135deg,#6b3cc0,#8a52dd);border-bottom-right-radius:7px}
.msg.small{font-size:20px}
.choice{
  border:0;color:#fff;width:100%;padding:23px 22px;border-radius:14px;font-size:27px;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:14px;cursor:pointer;
  box-shadow:0 8px 20px #0005;transition:.18s transform,.18s filter
}
.choice:active,.action:active{transform:scale(.98);filter:brightness(1.1)}
.bkash{background:linear-gradient(90deg,#247e32,#3b9039)}
.nagad{background:linear-gradient(90deg,#236795,#3989bd)}
.binance{background:linear-gradient(90deg,#24658d,#3689bd)}
.logo{width:42px;height:42px;border-radius:9px;background:#fff;color:#111;display:grid;place-items:center;font-size:14px;font-weight:900}
.logo.b{background:#fff;color:#d71364}.logo.n{background:#fff;color:#f04b22}.logo.bi{background:#080808;color:#f5c842}
.logo img{width:100%;height:100%;object-fit:contain;border-radius:9px;display:block}
.logo svg{width:100%;height:100%;display:block}
.logo.bi svg{width:75%;height:75%;margin:auto}
.composer{display:flex;align-items:center;gap:12px;margin:24px 0 16px;padding:10px 12px;border:1px solid #425264;border-radius:28px;background:#202c3a}
.menu{width:58px;height:58px;border:0;border-radius:22px;background:#2d8ac5;color:white;font-size:30px}
.composer input{flex:1;border:0;outline:0;background:transparent;color:white;font-size:21px;min-width:0}
.send{width:58px;height:58px;border:0;border-radius:50%;background:#2d8ac5;color:#fff;font-size:28px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.action{
  border:0;border-radius:20px;min-height:92px;padding:15px;color:#eef4fb;font-size:25px;font-weight:800;cursor:pointer;
  background:var(--green);box-shadow:0 8px 18px #0004;transition:.18s transform
}
.action.blue{background:linear-gradient(135deg,#347db5,#3e91c7)}
.action.red{background:var(--red)}.wide{grid-column:1/-1}
.notice{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(100px);
  background:#eef4fb;color:#16202b;padding:13px 20px;border-radius:14px;font-weight:800;box-shadow:0 8px 30px #0008;
  transition:.25s transform;z-index:10;white-space:nowrap
}
.notice.show{transform:translateX(-50%) translateY(0)}
.modal{
 display:none;position:fixed;inset:0;background:#0009;z-index:20;align-items:flex-end;justify-content:center
}
.modal.show{display:flex}
.sheet{width:min(680px,100%);background:#172331;border-radius:26px 26px 0 0;padding:24px 18px 32px}
.sheet h2{margin:0 0 12px;font-size:25px}.sheet p{color:#b8c4d0;line-height:1.5}
.close{float:right;background:#2b3b4c;border:0;border-radius:50%;color:#fff;width:40px;height:40px;font-size:20px}
@media(max-width:420px){.choice{font-size:23px}.action{font-size:20px}.msg{font-size:19px}.title h1{font-size:24px}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="avatar">QS</div>
    <div class="title"><h1>Quick Store</h1><p>Telegram Web App</p></div>
    <div class="dotmenu">⋮</div>
  </div>

  <div class="status">🌐 Clip proxy- 1GB | 140.0৳ | Stock: 0</div>

  <div class="chat">
    <div class="msg right">/start</div>
    <div class="msg">💵 স্বাগতম! নিচের মেনু থেকে সিলেক্ট করুন</div>
    <button class="choice bkash" onclick="openPayment('bKash')"><span class="logo b" aria-label="bKash">
<svg viewBox="0 0 64 64" role="img">
  <path fill="#E2136E" d="M8 12h48a8 8 0 0 1 8 8v24a8 8 0 0 1-8 8H8z"/>
  <path fill="#fff" d="M17 35c7-2 12-9 14-18 2 10 8 17 16 20-8 2-14 7-18 14-1-8-5-13-12-16z"/>
  <path fill="#fff" d="M25 20l5 8-8-3zm14 2 8 4-8 4z"/>
</svg></span>bKash</button>
    <button class="choice nagad" onclick="openPayment('Nagad')"><span class="logo n" aria-label="Nagad">
<svg viewBox="0 0 64 64" role="img">
  <rect x="4" y="4" width="56" height="56" rx="12" fill="#F15A24"/>
  <path fill="#fff" d="M18 44V20h7l13 15V20h8v24h-7L26 29v15z"/>
</svg></span>Nagad</button>
    <button class="choice binance" onclick="openPayment('Binance')"><span class="logo bi"><svg viewBox="0 0 24 24" aria-label="Binance logo" role="img"><path fill="#F3BA2F" d="m16.624 13.92 2.717 2.716-7.353 7.353-7.352-7.352 2.717-2.717 4.636 4.66 4.635-4.66zm4.637-4.636L24 12l-2.715 2.716L18.568 12l2.693-2.716zm-9.272 0 2.716 2.692-2.717 2.717L9.272 12l2.716-2.715zm-9.273 0L5.41 12l-2.692 2.692L0 12l2.716-2.716zM11.99.01l7.352 7.33-2.717 2.715-4.636-4.636-4.635 4.66-2.717-2.716L11.989.011z"/></svg></span>Binance</button>
  </div>

  <div class="composer">
    <button class="menu">☰</button>
    <input id="message" placeholder="Message">
    <button class="send" onclick="sendMessage()">◉</button>
  </div>

  <div class="grid">
    <button class="action" onclick="showNotice('Buy Now clicked')">🆕 Buy Now</button>
    <button class="action" onclick="showNotice('Mail Code opened')">🔑 Mail Code</button>
    <button class="action blue wide" onclick="showNotice('2FA Code opened')">🛡️ 2FA Code</button>
    <button class="action" onclick="openDeposit()">💵 Deposit</button>
    <button class="action" onclick="showNotice('Dashboard opened')">📊 Dashboard</button>
    <button class="action red wide" onclick="showNotice('Support opened')">🧑‍💼 Support</button>
  </div>
</div>

<div class="notice" id="notice"></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="sheet">
    <button class="close" onclick="closeModal()">×</button>
    <h2 id="modalTitle">Payment</h2>
    <p id="modalText"></p>
    <button class="action blue wide" onclick="closeModal()">ঠিক আছে</button>
  </div>
</div>

<script>
function showNotice(text){
 const n=document.getElementById('notice'); n.textContent=text; n.classList.add('show');
 clearTimeout(window.nt); window.nt=setTimeout(()=>n.classList.remove('show'),2200);
}
function openPayment(method){
 document.getElementById('modalTitle').textContent=method+' Payment';
 document.getElementById('modalText').textContent=method+' payment option selected. Real payment processing requires your own authorized payment account/API and backend verification.';
 document.getElementById('modal').classList.add('show');
}
function openDeposit(){
 document.getElementById('modalTitle').textContent='Deposit';
 document.getElementById('modalText').textContent='Choose a payment method above to continue with your deposit flow.';
 document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function sendMessage(){
 const i=document.getElementById('message'); const v=i.value.trim();
 if(!v) return showNotice('আগে একটি মেসেজ লিখুন');
 showNotice('Message sent: '+v); i.value='';
}
</script>
</body>
</html>
