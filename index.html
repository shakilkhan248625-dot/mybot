<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy & VPN Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <div class="welcome-box">
            <h2>🔥 Welcome to GoProxy & VPN! 🔥</h2>
            <p>🚀 High-Speed Residential Proxies & Premium VPNs.</p>
            <p>⚡ 100% Automatic Delivery & Instant Access.</p>
            <p>🤝 Invite friends & earn commission.</p>
            <div class="payment-methods">
                <span>Payment method:</span> 
                <span class="pay-icon">bKash</span> 
                <span class="pay-icon">Nagad</span> 
                <span class="pay-icon">Binance</span>
            </div>
            <h3>🛒 Select an option below:</h3>
        </div>

        <!-- Colored Buttons Grid -->
        <div class="button-grid">
            <button class="btn btn-blue" onclick="sendAction('profile')">👤 Profile</button>
            <button class="btn btn-green" onclick="sendAction('buy_proxy')">🛒 Buy Proxy / VPN</button>
            
            <button class="btn btn-red" onclick="sendAction('deposit')">💳 Deposit Balance</button>
            <button class="btn btn-dark-red" onclick="sendAction('support')">🎧 Support</button>
            
            <button class="btn btn-cyan" onclick="sendAction('referral')">🤝 My Referral</button>
            <button class="btn btn-dark-blue" onclick="sendAction('how_to_buy')">📖 How to Buy</button>
            
            <button class="btn btn-light-blue" onclick="sendAction('language')">🌐 Change Language</button>
            <button class="btn btn-yellow" onclick="sendAction('top_buyers')">🏆 Top Buyers</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function sendAction(action) {
            tg.sendData(action); // বটের কাছে কমান্ড পাঠাবে
            tg.close();
        }
    </script>
</body>
</html>
